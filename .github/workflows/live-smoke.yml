name: 🔴 Live API Smoke Test

# The only workflow that touches GOOGLE_API_KEY. Deliberately not run on
# pull_request: Renovate opens PRs constantly, and each run would burn quota
# and expose the secret to freshly-bumped dependency code.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"  # Mondays 06:00 UTC

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  live-smoke:
    name: 🌐 Hit the Real Gemini API
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 📦 Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"

      # Deliberately runs before the secret is in scope: uv sync executes
      # build backends from the dependency tree.
      - name: 📥 Install Dependencies
        run: uv sync --all-extras --dev

      - name: 🚀 Run Live Tests
        # Secret is scoped to this step only, not the whole job.
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: uv run pytest -m live -v
