name: 🚀 CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# No job here needs a Gemini API key: the test suite stubs the client.
# Live API coverage lives in live-smoke.yml.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: 🔍 Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 📦 Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"  # Running linting only on Python 3.12

      - name: 📥 Install Dependencies
        run: uv sync --all-extras --dev

      - name: 🧐 Run Ruff Linter
        run: uv tool run ruff check

  test:
    name: 🧪 Run Tests
    needs: lint  # Runs only if linting succeeds ✅
    runs-on: windows-latest  # Running tests only on Windows
    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 📦 Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: 📥 Install Dependencies
        run: uv sync --all-extras --dev

      - name: 🚀 Run Tests
        run: uv tool run hatch test --parallel --all

  test-release:
    name: 📦 Build & Publish Package
    needs: test  # Runs only if tests pass ✅
    # Never build and publish from an unreviewed pull request head.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 📦 Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: 📥 Install Dependencies
        run: uv sync --all-extras --dev

      - name: 🔖 Version Package
        run: uv tool run hatch version rc

      - name: 📦 Build Package
        run: uv tool run hatch build

      - name: 🚀 Publish to TestPyPi
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          skip-existing: true
