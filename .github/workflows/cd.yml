name: 🚀 CD Pipeline

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false  # never interrupt a release mid-publish

jobs:
  lint:
    name: 🔍 Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 📦 Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"  # Running linting only on Python 3.12

      - name: 📥 Install Dependencies
        run: uv sync --all-extras --dev

      - name: 🧐 Run Ruff Linter
        run: uv tool run ruff check

  test:
    name: 🧪 Run Tests
    needs: lint  # Runs only if linting succeeds ✅
    runs-on: windows-latest  # Running tests only on Windows
    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 📦 Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: 📥 Install Dependencies
        run: uv sync --all-extras --dev

      - name: 🚀 Run Tests
        run: uv tool run hatch test --parallel --all

  release:
    name: 📦 Build & Publish Package
    needs: test  # Runs only if tests pass ✅
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 📦 Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: 📥 Install Dependencies
        run: uv sync --all-extras --dev

      - name: 📦 Build Package
        run: uv tool run hatch build

      - name: 📤 Upload Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: ${{ github.workspace }}/dist/*

      - name: 📦 Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          body_path: CHANGELOG.md
          files: dist/*

      - name: 🚀 Publish to PyPi
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          skip-existing: true
